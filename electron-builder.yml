appId: dev.pixel.workbench
productName: PIXEL
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: drizzle
    to: drizzle
asarUnpack:
  - '**/*.node'
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  # Ad-hoc signature: required on Apple Silicon after fuses modify the binary. Replace with a
  # Developer ID identity for distribution (and add notarization).
  identity: "-"
# Harden the packaged binary: it must not be usable as a generic Node runtime (which would inherit
# PIXEL's Keychain access), accept NODE_OPTIONS, open an inspector, or load code outside the asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
